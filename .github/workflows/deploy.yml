name: Deploy to Droplet

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v2.0, etc.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Droplet
        run: |
          ssh -o StrictHostKeyChecking=no user@your-droplet-ip << 'EOF'
          cd /var/www/klps.co.uk
          git fetch --tags
          git checkout tags/${{ github.ref_name }} -b deploy
          npm install
          npm run build
          sudo systemctl reload apache2
          EOF
