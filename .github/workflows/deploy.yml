name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        npm install

    - name: Build Project
      run: |
        npm run build

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H 167.71.133.117 >> ~/.ssh/known_hosts

    - name: Deploy to Droplet
      run: |
        rsync -avz --exclude '.git*' --exclude 'node_modules' ./build/ root@167.71.133.117:/var/www/klps.co.uk/
